name: build-image

# 触发方式：
#   1) 手动 —— Actions 页面点 "Run workflow"，可填上游 ref（分支 / tag / SHA）
#   2) 每周一 02:17 (UTC+8) 自动跑一次，跟随上游 main 的更新
#   3) 推送本仓库的 Dockerfile / workflow 时
on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: '上游 ref（分支 / tag / commit SHA）'
        required: false
        default: main
        type: string
  schedule:
    - cron: '17 18 * * 0'
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/build-image.yml

permissions:
  contents: write   # 往 Release 挂离线包
  packages: write   # 推 ghcr.io

env:
  IMAGE_NAME: ccgo-manager
  UPSTREAM_REPO: https://github.com/learningdog1/CommandCodeGo-manager.git

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解析上游 ref
        id: ref
        run: |
          REF='${{ github.event.inputs.upstream_ref }}'
          REF=${REF:-main}
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          # docker tag 不允许 '/'，ref 是 feat/xxx 这类分支名时替换掉
          echo "tag=$(printf '%s' "$REF" | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 只构建一次：先 load 进本地 docker，随后手动 push + save，
      # 比「push 一次、再 build 一次导出 tar」省一轮完整构建。
      - name: 构建（linux/amd64）
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.ref.outputs.tag }}
          build-args: |
            UPSTREAM_REPO=${{ env.UPSTREAM_REPO }}
            UPSTREAM_REF=${{ steps.ref.outputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 打印镜像信息
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest"
          echo "上游 ref: ${{ steps.ref.outputs.ref }}"
          docker image inspect "$IMAGE" --format '镜像大小: {{.Size}} bytes'
          docker run --rm --entrypoint sh "$IMAGE" -c 'cat /app/UPSTREAM_SHA'

      - name: 推送 GHCR
        run: |
          docker push "ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest"
          docker push "ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.ref.outputs.tag }}"

      # 国内直连 ghcr.io 通常很慢甚至不通，所以同时产出一份离线 tar.gz：
      # NAS 上 `docker load -i` 直接导入。
      - name: 导出离线镜像 tar.gz
        run: |
          docker save "ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest" \
            | gzip -9 > "${{ env.IMAGE_NAME }}-amd64.tar.gz"
          ls -lh "${{ env.IMAGE_NAME }}-amd64.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: image-tar-amd64
          path: ${{ env.IMAGE_NAME }}-amd64.tar.gz
          retention-days: 14

      - name: 挂到固定 Release（稳定下载链接）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view image-latest >/dev/null 2>&1 \
            || gh release create image-latest \
                 --title "Docker 离线镜像（滚动更新）" \
                 --notes "amd64 镜像 tar.gz。NAS 上：\`docker load -i ccgo-manager-amd64.tar.gz\`，然后用 compose 起容器。"
          gh release upload image-latest "${{ env.IMAGE_NAME }}-amd64.tar.gz" --clobber
